[package]
name = "langoneditor"
version = "0.1.0"
description = "Desktop editor, visualizer, importer and exporter for OKF knowledge bundles"
authors = ["Henrique Breim"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "langoneditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
