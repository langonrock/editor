[test]
coverage = true
coverageSkipTestFiles = true
# These must be globs: a bare prefix like "node_modules/" is silently ignored.
# The dependency entries are all needed. `bun link` reports the symlink target,
# so langonrock shows up as ../langonrock/src/... and never matches
# node_modules; in CI the checkout lives at .langonrock, which the dotless
# pattern misses; once it is consumed as a published package the node_modules
# pattern is the one that catches it. Either way the threshold must measure
# this project, not its dependency.
coveragePathIgnorePatterns = [
  "**/node_modules/**",
  "**/langonrock/**",
  "**/.langonrock/**",
  "test/**"
]
coverageThreshold = { line = 0.85, function = 0.85 }
