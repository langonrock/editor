# Temporary: probes why ldd fails on the bun-compiled sidecar, which is what
# aborts linuxdeploy during appimage bundling. Delete once the release
# workflow is green.
name: debug-appimage

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/langonrock
          path: .langonrock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install && bun link
        working-directory: .langonrock

      - run: bun install --frozen-lockfile

      - run: bun run sidecar

      - name: Probe the sidecar
        shell: bash {0}
        run: |
          BIN=src-tauri/binaries/langonrock-x86_64-unknown-linux-gnu
          ls -la src-tauri/binaries/
          file "$BIN"
          echo "===== ldd output:"
          ldd "$BIN"
          echo "ldd exit: $?"
          echo "===== does it execute:"
          timeout 3 "$BIN" --version
          echo "run exit: $?"
