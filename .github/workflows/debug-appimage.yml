# Temporary: lets the appimage bundling fail, then inspects the AppDir to see
# why ldd rejects the sidecar copy there while accepting the original. Delete
# once the release workflow is green.
name: debug-appimage

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/langonrock
          path: .langonrock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libfuse2

      - run: bun install && bun link
        working-directory: .langonrock

      - run: bun install --frozen-lockfile

      - run: bun run sidecar

      - name: Build until bundling fails
        run: bun run tauri build --verbose || true
        env:
          NO_STRIP: true

      - name: Autopsy the AppDir
        shell: bash {0}
        run: |
          APPDIR=src-tauri/target/release/bundle/appimage/langoneditor.AppDir
          SIDECAR="$APPDIR/usr/bin/langonrock"
          echo "===== bin dir:"
          ls -la "$APPDIR/usr/bin/"
          echo "===== same bytes as the built sidecar?"
          cmp src-tauri/binaries/langonrock-x86_64-unknown-linux-gnu "$SIDECAR" && echo identical || echo DIFFERS
          echo "===== rpath on the sidecar copy:"
          readelf -d "$SIDECAR" | grep -i 'rpath\|runpath'
          echo "===== plain ldd:"
          ldd "$SIDECAR"
          echo "plain ldd exit: $?"
          echo "===== ldd with the AppDir lib path, as linuxdeploy resolves it:"
          LD_LIBRARY_PATH="$APPDIR/usr/lib:$APPDIR/usr/lib/x86_64-linux-gnu" ldd "$SIDECAR"
          echo "appdir ldd exit: $?"
