# Temporary: validates that pointing linuxdeploy at a modern patchelf via the
# PATCHELF env var fixes appimage bundling. Delete once the release workflow
# is green.
name: debug-appimage

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/langonrock
          path: .langonrock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libfuse2
          curl -sL https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0-x86_64.tar.gz \
            | sudo tar xz -C /usr/local ./bin/patchelf

      - run: bun install && bun link
        working-directory: .langonrock

      - run: bun install --frozen-lockfile

      - run: bun run sidecar

      - run: bun run tauri build --verbose
        env:
          NO_STRIP: true
          PATCHELF: /usr/local/bin/patchelf

      - name: Verify the bundled sidecar still works
        run: |
          ls -la src-tauri/target/release/bundle/appimage/
          APPDIR=src-tauri/target/release/bundle/appimage/langoneditor.AppDir
          ldd "$APPDIR/usr/bin/langonrock" > /dev/null
          timeout 3 "$APPDIR/usr/bin/langonrock" --version
