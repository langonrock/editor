# Temporary: checks whether patchelf is what corrupts the bun-compiled
# sidecar, and whether a modern patchelf avoids it. Delete once the release
# workflow is green.
name: debug-appimage

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/langonrock
          path: .langonrock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: sudo apt-get update && sudo apt-get install -y patchelf

      - run: bun install && bun link
        working-directory: .langonrock

      - run: bun install --frozen-lockfile

      - run: bun run sidecar

      - name: Patch with apt patchelf vs modern patchelf
        shell: bash {0}
        run: |
          BIN=src-tauri/binaries/langonrock-x86_64-unknown-linux-gnu
          probe() {
            ldd "$1" > /dev/null 2>&1
            echo "$2 ldd exit: $?"
            timeout 3 "$1" --version > /dev/null 2>&1
            echo "$2 run exit: $?"
          }

          echo "===== apt patchelf $(patchelf --version):"
          cp "$BIN" /tmp/a
          patchelf --set-rpath '$ORIGIN/../lib' /tmp/a && probe /tmp/a "apt-patched"

          curl -sL https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0-x86_64.tar.gz | tar xz -C /tmp ./bin/patchelf
          echo "===== modern patchelf $(/tmp/bin/patchelf --version):"
          cp "$BIN" /tmp/b
          /tmp/bin/patchelf --set-rpath '$ORIGIN/../lib' /tmp/b && probe /tmp/b "modern-patched"

          echo "===== modern then apt again, in case linuxdeploy re-patches:"
          cp /tmp/b /tmp/c
          patchelf --set-rpath '$ORIGIN/../lib' /tmp/c && probe /tmp/c "re-patched"
