# Temporary: reproduces the release appimage bundling with verbose output so
# the real linuxdeploy error is visible. Delete once the release workflow is
# green.
name: debug-appimage

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/langonrock
          path: .langonrock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libfuse2

      - name: Inspect gstreamer state on the runner
        run: |
          ls -la /usr/lib/x86_64-linux-gnu/gstreamer-1.0/ || echo "NO gstreamer plugins dir"
          ls -la /usr/lib/x86_64-linux-gnu/gstreamer1.0/ || echo "NO gstreamer helpers dir"
          dpkg -l | grep -i gstreamer || echo "NO gstreamer packages"

      - run: bun install && bun link
        working-directory: .langonrock

      - run: bun install --frozen-lockfile

      - run: bun run sidecar

      - run: bun run tauri build --verbose
        env:
          NO_STRIP: true
