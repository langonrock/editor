name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # langonrock is consumed as a local link, so it has to exist on disk
      # before `bun install` can resolve it. Publishing it to a registry would
      # remove this step.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/langonrock
          path: .langonrock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk is what the Tauri webview links against on Linux.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev

      - run: bun install && bun link
        working-directory: .langonrock

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run format:check

      - run: bun run typecheck

      - run: bun test

      # tauri-build verifies the sidecar exists, so it must be produced before
      # anything under src-tauri is compiled.
      - run: bun run sidecar

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml
