name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel are separate artifacts on purpose. The
          # sidecar is ~62 MB per architecture, so a universal binary would put
          # 124 MB of it in every download.
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/langonrock
          path: .langonrock
          token: ${{ secrets.LANGONROCK_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev

      - run: bun install && bun link
        working-directory: .langonrock

      - run: bun install --frozen-lockfile

      # The Rust host triple decides the sidecar filename, so a cross-compiled
      # macOS bundle needs the sidecar built for the target, not for the runner.
      - name: Build the sidecar
        shell: bash
        run: |
          if [ "${{ matrix.args }}" = "--target aarch64-apple-darwin" ]; then
            bun run sidecar aarch64-apple-darwin
          elif [ "${{ matrix.args }}" = "--target x86_64-apple-darwin" ]; then
            bun run sidecar x86_64-apple-darwin
          else
            bun run sidecar
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without a Developer ID the .dmg is unsigned and Gatekeeper blocks it
          # on download. Set these to sign and notarize.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: langoneditor ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
